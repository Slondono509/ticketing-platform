# ElasticMQ: SQS-compatible broker used locally. Mirrors the queues created by Terraform in AWS,
# including the dead-letter queues and redrive policies.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  ticketing-order-commands-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  ticketing-order-commands {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ticketing-order-commands-dlq"
      maxReceiveCount = 5
    }
  }
  ticketing-reservation-expiration-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
  ticketing-reservation-expiration {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ticketing-reservation-expiration-dlq"
      maxReceiveCount = 3
    }
  }
}
